spring.application.name=meocare
spring.datasource.url=${MEOCARE_DB_URL:jdbc:mysql://192.168.11.110:3306/meowcare_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${MEOCARE_DB_USERNAME:root}
spring.datasource.password=${MEOCARE_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${MEOCARE_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${MEOCARE_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${MEOCARE_JWT_SECRET:bWVvY2FyZS12ZXRlcmluYXJ5LWNsaW5pYy1zZWNyZXQta2V5LTIwMjYtMjU2Yml0LXNpZ25pbmcta2V5}
app.jwt.expiration-ms=${MEOCARE_JWT_EXPIRATION_MS:86400000}

app.bootstrap.enabled=${MEOCARE_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin.full-name=${MEOCARE_ADMIN_FULL_NAME:Clinic Administrator}
app.bootstrap.admin.email=${MEOCARE_ADMIN_EMAIL:admin@meocare.clinic}
app.bootstrap.admin.password=${MEOCARE_ADMIN_PASSWORD:Admin@123456}
app.bootstrap.admin.phone=${MEOCARE_ADMIN_PHONE:+1 (800) 555-0100}

app.upload.dir=${MEOCARE_UPLOAD_DIR:uploads}
app.upload.max-file-size-bytes=${MEOCARE_UPLOAD_MAX_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
