stages:
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

build_and_test:
  stage: build
  image: eclipse-temurin:17-jdk
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\/.*/ || $CI_COMMIT_BRANCH =~ /^ci\/.*/
  script:
    - apt-get update && apt-get install -y --no-install-recommends maven
    - cd meocare
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - meocare/target/*.jar
    expire_in: 1 day

deploy_to_mon_server:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "--- debug key file ---"
    - wc -l -c "$SSH_PRIVATE_KEY"
    - head -n 1 "$SSH_PRIVATE_KEY"
    - tail -n 1 "$SSH_PRIVATE_KEY"
    - grep -c $'\r' "$SSH_PRIVATE_KEY" || true
    - echo "--- end debug ---"
    - tr -d '\r' < "$SSH_PRIVATE_KEY" > /tmp/deploy_key
    - echo >> /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - ssh-keygen -y -f /tmp/deploy_key
    - ssh-add /tmp/deploy_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H 192.168.11.110 >> ~/.ssh/known_hosts
  script:
    - scp meocare/target/*.jar root@192.168.11.110:/opt/meocare/meocare.jar
    - ssh root@192.168.11.110 "pkill -f 'meocare.jar' || true; nohup java -Xms256m -Xmx512m -jar /opt/meocare/meocare.jar > /opt/meocare/app.log 2>&1 &"